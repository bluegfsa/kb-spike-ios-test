name: kb-spike-ios
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate dictionary (mmap asset)
        run: node tools/gen_dict.js
      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la Keyboard
      - name: Build zh (ReleaseZh)
        run: |
          set -o pipefail
          xcodebuild -project KBSpike.xcodeproj -scheme KBSpike-zh -configuration ReleaseZh \
            -sdk iphoneos -derivedDataPath build_zh \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -50
      - name: Build en (ReleaseEn)
        run: |
          set -o pipefail
          xcodebuild -project KBSpike.xcodeproj -scheme KBSpike-en -configuration ReleaseEn \
            -sdk iphoneos -derivedDataPath build_en \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -50
      - name: Verify + package ipas
        run: |
          set -e
          for cfg in zh en; do
            APP=$(find build_$cfg -name "KBSpike.app" -type d | head -1)
            echo "[$cfg] APP=$APP"
            test -n "$APP"
            D=$(dirname "$APP")
            rm -rf "$D/Payload"; mkdir -p "$D/Payload"; cp -R "$APP" "$D/Payload/"
            ( cd "$D" && zip -rq "KBSpike-C2-1.91-$cfg.ipa" Payload )
            echo "--- [$cfg] ipa ---"; ls -la "$D/KBSpike-C2-1.91-$cfg.ipa"
            echo "[$cfg] app CFBundleIdentifier:"; /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
            echo "[$cfg] app CFBundleDisplayName:"; /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist"
            APX=$(find "$APP/PlugIns" -name "*.appex" -type d | head -1)
            echo "[$cfg] appex=$APX"
            echo "[$cfg] appex CFBundleIdentifier:"; /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APX/Info.plist"
            echo "[$cfg] appex CFBundleDisplayName:"; /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APX/Info.plist"
          done
      - name: Upload zh ipa
        uses: actions/upload-artifact@v4
        with:
          name: KBSpike-C2-1.91-zh
          path: build_zh/Build/Products/ReleaseZh-iphoneos/KBSpike-C2-1.91-zh.ipa
          if-no-files-found: error
      - name: Upload en ipa
        uses: actions/upload-artifact@v4
        with:
          name: KBSpike-C2-1.91-en
          path: build_en/Build/Products/ReleaseEn-iphoneos/KBSpike-C2-1.91-en.ipa
          if-no-files-found: error
