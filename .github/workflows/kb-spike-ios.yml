name: kb-spike-ios
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Candidate quality regression (dict gate)
        run: |
          set -e
          if [ -f tools/cand_regression.py ] && [ -f tools/cand_cases.tsv ]; then
            echo '== 候选质量回归：Keyboard/pinyin_simp.dict.yaml =='
            python3 tools/cand_regression.py Keyboard/pinyin_simp.dict.yaml tools/cand_cases.tsv
            echo '候选回归通过'
          else
            echo '::warning file=tools/cand_regression.py::候选回归脚本或用例集未入仓，本次跳过门禁（测试工程师入仓后自动生效）'
          fi
      - name: en2zh candidate regression (dict gate)
        run: |
          set -e
          if [ -f tools/en2zh_regression.py ] && [ -f tools/en2zh_cases.tsv ] && [ -f Keyboard/en2zh.txt ]; then
            python3 tools/en2zh_regression.py Keyboard/en2zh.txt tools/en2zh_cases.tsv
            echo '英中回归通过'
          else
            echo '::warning file=tools/en2zh_regression.py::英中回归脚本/用例/en2zh.txt 缺失，本次跳过'
          fi
      - name: Generate dictionary (mmap asset)
        run: node tools/gen_dict.js
      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la Keyboard
      - name: App Store compliance scan (non-blocking, report only)
        continue-on-error: true
        run: |
          echo '== app-store-compliance 体检（非阻断，仅出报告，不拦出包）=='
          rm -rf /tmp/asc
          git clone --depth 1 https://github.com/mjmirza/app-store-compliance /tmp/asc || { echo 'clone failed (non-blocking)'; exit 0; }
          bash /tmp/asc/agent-os/hooks/app-store-compliance-guard.sh "$PWD" 2>&1 | tee compliance-report.txt || echo "guard exit=$? (non-blocking)"
          if [ -d store-metadata ]; then python3 /tmp/asc/scripts/metadata-audit.py --metadata store-metadata 2>&1 | tee -a compliance-report.txt || true; fi
      - name: Upload compliance report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: appstore-compliance-report
          path: compliance-report.txt
          if-no-files-found: ignore
      - name: Build zh (ReleaseZh)
        run: |
          set -o pipefail
          xcodebuild -project KBSpike.xcodeproj -scheme KBSpike-zh -configuration ReleaseZh \
            -sdk iphoneos -derivedDataPath build_zh \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -60
      - name: Build en (ReleaseEn)
        run: |
          set -o pipefail
          xcodebuild -project KBSpike.xcodeproj -scheme KBSpike-en -configuration ReleaseEn \
            -sdk iphoneos -derivedDataPath build_en \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -60
      - name: Verify + package ipas
        run: |
          set -e
          for cfg in zh en; do
            APP=$(find build_$cfg -name "KBSpike.app" -type d | head -1)
            echo "[$cfg] APP=$APP"
            test -n "$APP"
            D=$(dirname "$APP")
            rm -rf "$D/Payload"; mkdir -p "$D/Payload"; cp -R "$APP" "$D/Payload/"
            ( cd "$D" && zip -rq "KBSpike-C2-1.99-$cfg.ipa" Payload )
            echo "--- [$cfg] ipa ---"; ls -la "$D/KBSpike-C2-1.99-$cfg.ipa"
            echo "[$cfg] app CFBundleIdentifier:"; /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
            echo "[$cfg] app CFBundleDisplayName:"; /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist"
            echo "[$cfg] version:"; /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
            APX=$(find "$APP/PlugIns" -name "*.appex" -type d | head -1)
            echo "[$cfg] appex=$APX"
            echo "[$cfg] appex CFBundleIdentifier:"; /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APX/Info.plist"
            echo "[$cfg] appex CFBundleDisplayName:"; /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APX/Info.plist"
          done
      - name: Upload zh ipa
        uses: actions/upload-artifact@v4
        with:
          name: KBSpike-C2-1.99-zh
          path: build_zh/Build/Products/ReleaseZh-iphoneos/KBSpike-C2-1.99-zh.ipa
          if-no-files-found: error
      - name: Upload en ipa
        uses: actions/upload-artifact@v4
        with:
          name: KBSpike-C2-1.99-en
          path: build_en/Build/Products/ReleaseEn-iphoneos/KBSpike-C2-1.99-en.ipa
          if-no-files-found: error







