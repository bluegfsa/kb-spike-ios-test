name: kb-spike-ios
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate dictionary (mmap asset)
        run: node tools/gen_dict.js
      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la Keyboard
      - name: Build unsigned (app + keyboard extension)
        run: |
          set -o pipefail
          xcodebuild -project KBSpike.xcodeproj -scheme KBSpike -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -100
      - name: Verify .appex + dict bundled
        run: |
          APP=$(find build -name "KBSpike.app" -type d | head -1)
          echo "APP=$APP"
          find build -name "*.appex" -type d -print
          ls -la "$APP/PlugIns" || true
          echo "--- dict in extension bundle ---"
          find build -iname "dict.txt" -print
          test -n "$(find build -name '*.appex' -type d -print -quit)" && echo "S1_OK: appex found" || (echo "S1_FAIL: no appex"; exit 1)
      - name: Package unsigned .ipa (Payload zip, for Sideloadly)
        run: |
          cd "$(dirname "$(find build -name 'KBSpike.app' -type d | head -1)")"
          rm -rf Payload && mkdir -p Payload
          cp -R KBSpike.app Payload/
          zip -rq KBSpike-unsigned.ipa Payload
          ls -la KBSpike-unsigned.ipa
          unzip -l KBSpike-unsigned.ipa | grep -E "appex|Info.plist" | head
      - name: Upload unsigned ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: KBSpike-unsigned-ipa
          path: build/Build/Products/Release-iphoneos/KBSpike-unsigned.ipa
          if-no-files-found: error