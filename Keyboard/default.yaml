# Rime default settings (spike 裁剪：只留 pinyin_simp)
config_version: '0.50'

schema_list:
  - schema: pinyin_simp

menu:
  page_size: 30

punctuator:
  full_shape:
    __include: punctuation:/full_shape
  half_shape:
    __include: punctuation:/half_shape

key_binder:
  bindings:
    __patch:
      - key_bindings:/emacs_editing
      - key_bindings:/paging_with_minus_equal

recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"

ascii_composer:
  good_old_caps_lock: true
