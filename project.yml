name: KBSpike
options:
  bundleIdPrefix: com.smallblocks
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  KBSpike:
    type: application
    platform: iOS
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smallblocks.kbspike
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
    preBuildScripts:
      - name: LogicSelfTest
        basedOnDependencyAnalysis: false
        script: |
          set -e
          xcrun swiftc -o "$DERIVED_FILE_DIR/logic_selftest" \
            "$SRCROOT/Keyboard/KeyboardLogic.swift" "$SRCROOT/tools/SelfTest/main.swift"
          "$DERIVED_FILE_DIR/logic_selftest"
    dependencies:
      - target: KBSpikeKeyboard
        embed: true
  KBSpikeKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smallblocks.kbspike.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_OBJC_BRIDGING_HEADER: Keyboard/KBSpikeKeyboard-Bridging-Header.h
        CLANG_CXX_LIBRARY: libc++
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Frameworks/librime-headers
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/Frameworks
        OTHER_LDFLAGS:
          - -lrime-ios-arm64
          - -lc++
          - -lz
