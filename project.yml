name: KBSpike
options:
  bundleIdPrefix: com.smallblocks
  deploymentTarget:
    iOS: "15.0"
configs:
  Debug: debug
  Release: release
  ReleaseZh: release
  ReleaseEn: release
settings:
  base:
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  KBSpike:
    type: application
    platform: iOS
    sources:
      - App
      - path: LICENSES
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smallblocks.yuqiao
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        ReleaseZh:
          PRODUCT_BUNDLE_IDENTIFIER: com.smallblocks.yuqiao
          INFOPLIST_FILE: Config/App-Info-zh.plist
          CODE_SIGN_ENTITLEMENTS: Config/App-zh.entitlements
        ReleaseEn:
          PRODUCT_BUNDLE_IDENTIFIER: com.smallblocks.wordbridge
          INFOPLIST_FILE: Config/App-Info-en.plist
          CODE_SIGN_ENTITLEMENTS: Config/App-en.entitlements
    preBuildScripts:
      - name: LogicSelfTest
        basedOnDependencyAnalysis: false
        script: |
          set -e
          unset SDKROOT
          unset SWIFT_EXEC
          SYSROOT="$(xcrun --sdk macosx --show-sdk-path)"
          OUT="${TMPDIR:-/tmp}/kbspike_logic_selftest"
          xcrun --sdk macosx swiftc -sdk "$SYSROOT" -o "$OUT" \
            "$SRCROOT/Keyboard/KeyboardLogic.swift" "$SRCROOT/tools/SelfTest/main.swift"
          "$OUT"
    dependencies:
      - target: KBSpikeKeyboard
        embed: true
  KBSpikeKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smallblocks.yuqiao.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Keyboard/KBSpikeKeyboard-Bridging-Header.h
        CLANG_CXX_LIBRARY: libc++
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Frameworks/librime-headers
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/Frameworks
        OTHER_LDFLAGS:
          - -lrime-ios-arm64
          - -lc++
          - -lz
      configs:
        ReleaseZh:
          PRODUCT_BUNDLE_IDENTIFIER: com.smallblocks.yuqiao.keyboard
          INFOPLIST_FILE: Config/Keyboard-Info-zh.plist
          CODE_SIGN_ENTITLEMENTS: Config/Keyboard-zh.entitlements
        ReleaseEn:
          PRODUCT_BUNDLE_IDENTIFIER: com.smallblocks.wordbridge.keyboard
          INFOPLIST_FILE: Config/Keyboard-Info-en.plist
          CODE_SIGN_ENTITLEMENTS: Config/Keyboard-en.entitlements
schemes:
  KBSpike-zh:
    build:
      targets:
        KBSpike: all
    run:
      config: ReleaseZh
    archive:
      config: ReleaseZh
  KBSpike-en:
    build:
      targets:
        KBSpike: all
    run:
      config: ReleaseEn
    archive:
      config: ReleaseEn
